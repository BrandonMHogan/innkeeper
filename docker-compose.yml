services:
  db:
    image: timescale/timescaledb:2.27.0-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    command: bash -c "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000"
    env_file: .env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL:-}
    ports:
      - "9999:9999"
    depends_on:
      - api

  capture:
    build: ./capture
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      API_URL: http://127.0.0.1:${API_PORT:-8000}
    depends_on:
      - api
    volumes:
      - ./capture:/app

volumes:
  pgdata:
